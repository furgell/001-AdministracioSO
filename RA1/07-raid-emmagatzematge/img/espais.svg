<svg aria-label="Recreació: assistent de nou disc virtual d&#x27;Espacios de almacenamiento amb distribució Mirror" width="1040" height="620" viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg"><rect width="1040" height="620" fill="#ffffff"/><rect x="4" y="6" width="1040" height="620" rx="8" fill="#00000018" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1040" height="620" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/><rect x="1" y="1" width="1038" height="40" rx="8" fill="#eef0f3" stroke="none" stroke-width="1"/><rect x="1" y="30" width="1038" height="11" rx="0" fill="#eef0f3" stroke="none" stroke-width="1"/><rect x="12" y="12" width="16" height="16" rx="3" fill="#4a5a73" stroke="none" stroke-width="1"/><text x="38" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Asistente para nuevo disco virtual</text><text x="1024" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="16" fill="#444" font-weight="400" text-anchor="end">—   ☐   ✕</text><rect x="0" y="46" width="300" height="573" rx="0" fill="#f3f5f8" stroke="none" stroke-width="1"/><text x="24" y="90" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#1b1b1b" font-weight="400" text-anchor="start">Antes de comenzar</text><text x="24" y="134" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#1b1b1b" font-weight="400" text-anchor="start">Grupo de almacenamiento</text><text x="24" y="178" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#1b1b1b" font-weight="400" text-anchor="start">Nombre de disco virtual</text><text x="24" y="222" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#1b1b1b" font-weight="400" text-anchor="start">Gabinete</text><rect x="0" y="240" width="300" height="40" rx="0" fill="#cce4f7" stroke="none" stroke-width="1"/><rect x="0" y="240" width="5" height="40" rx="0" fill="#0067c0" stroke="none" stroke-width="1"/><text x="24" y="266" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#1b1b1b" font-weight="600" text-anchor="start">Distribución de almacenamiento</text><text x="24" y="310" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#888" font-weight="400" text-anchor="start">Aprovisionamiento</text><text x="24" y="354" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#888" font-weight="400" text-anchor="start">Tamaño</text><text x="24" y="398" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#888" font-weight="400" text-anchor="start">Confirmación</text><text x="24" y="442" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#888" font-weight="400" text-anchor="start">Resultados</text><text x="330" y="94" font-family="Segoe UI, Inter, sans-serif" font-size="22" fill="#1b1b1b" font-weight="600" text-anchor="start">Seleccionar la distribución de almacenamiento</text><text x="330" y="140" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Distribución:</text><rect x="330" y="152" width="260" height="120" rx="4" fill="#fff" stroke="#9a9a9a" stroke-width="1"/><text x="340" y="178" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Simple</text><rect x="334" y="194" width="109.39999999999998" height="32" rx="4" fill="#cce4f7" stroke="none" stroke-width="1"/><text x="340" y="214" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="600" text-anchor="start">Mirror</text><text x="340" y="250" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Parity</text><rect x="332" y="194" width="256" height="34" rx="6" fill="none" stroke="#d9692b" stroke-width="4"/><circle cx="610" cy="212" r="19" fill="#d9692b" stroke="#fff" stroke-width="3"/><text x="610" y="219" font-family="Segoe UI, Inter, sans-serif" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="620" y="140" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Descripción:</text><rect x="620" y="152" width="400" height="200" rx="6" fill="#f6f8fb" stroke="#d0d0d0" stroke-width="1"/><text x="636" y="186" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#333" font-weight="400" text-anchor="start">Los datos se duplican en dos o</text><text x="636" y="218" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#333" font-weight="400" text-anchor="start">tres discos físicos. Aumenta la</text><text x="636" y="250" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#333" font-weight="400" text-anchor="start">confiabilidad pero reduce la</text><text x="636" y="282" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#333" font-weight="400" text-anchor="start">capacidad. Necesita al menos</text><text x="636" y="314" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#333" font-weight="400" text-anchor="start">dos discos (equivale a RAID 1).</text><circle cx="1000" cy="170" r="19" fill="#d9692b" stroke="#fff" stroke-width="3"/><text x="1000" y="177" font-family="Segoe UI, Inter, sans-serif" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="330" y="420" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="600" text-anchor="start">Equivalències:</text><text x="330" y="456" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#333" font-weight="400" text-anchor="start">Simple ≈ RAID 0     Mirror ≈ RAID 1/10     Parity ≈ RAID 5/6</text><rect x="600" y="566" width="130" height="34" rx="4" fill="#fbfbfb" stroke="#9a9a9a" stroke-width="1"/><text x="665.0" y="589" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="middle">&lt; Anterior</text><rect x="740" y="566" width="130" height="34" rx="4" fill="#0067c0" stroke="#0067c0" stroke-width="1"/><text x="805.0" y="589" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">Siguiente &gt;</text><rect x="880" y="566" width="130" height="34" rx="4" fill="#fbfbfb" stroke="#9a9a9a" stroke-width="1"/><text x="945.0" y="589" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="middle">Cancelar</text></svg>