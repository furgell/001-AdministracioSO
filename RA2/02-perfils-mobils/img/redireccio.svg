<svg aria-label="Recreació: propietats de la redirecció de la carpeta Documents en una GPO" width="1040" height="620" viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg"><rect width="1040" height="620" fill="#ffffff"/><rect x="104" y="6" width="840" height="620" rx="8" fill="#00000018" stroke="none" stroke-width="1"/><rect x="100" y="0" width="840" height="620" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/><rect x="101" y="1" width="838" height="40" rx="8" fill="#eef0f3" stroke="none" stroke-width="1"/><rect x="101" y="30" width="838" height="11" rx="0" fill="#eef0f3" stroke="none" stroke-width="1"/><rect x="112" y="12" width="16" height="16" rx="3" fill="#e8b84a" stroke="none" stroke-width="1"/><text x="138" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Propiedades de Documentos</text><text x="924" y="27" font-family="Segoe UI, Inter, sans-serif" font-size="16" fill="#444" font-weight="400" text-anchor="end">—   ☐   ✕</text><rect x="120" y="60" width="94" height="34" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/><rect x="126" y="90" width="82" height="4" rx="2" fill="#0067c0" stroke="none" stroke-width="1"/><text x="132" y="83" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="600" text-anchor="start">Destino</text><text x="230" y="83" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Configuración</text><rect x="120" y="94" width="257" height="1" rx="0" fill="#c8c8c8" stroke="none" stroke-width="1"/><text x="130" y="140" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#444" font-weight="400" text-anchor="start">Puede especificar la ubicación de la carpeta Documentos.</text><text x="130" y="186" font-family="Segoe UI, Inter, sans-serif" font-size="19" fill="#1b1b1b" font-weight="400" text-anchor="start">Configuración:</text><rect x="130" y="198" width="780" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="131" y="230" width="778" height="2" rx="0" fill="#6f6f6f" stroke="none" stroke-width="1"/><text x="140" y="221" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Básica: redirigir la carpeta de todos a la misma ubicación</text><text x="888" y="221" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#444" font-weight="400" text-anchor="start">⌄</text><rect x="126" y="194" width="788" height="42" rx="6" fill="none" stroke="#d9692b" stroke-width="4"/><circle cx="918" cy="186" r="19" fill="#d9692b" stroke="#fff" stroke-width="3"/><text x="918" y="193" font-family="Segoe UI, Inter, sans-serif" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="130" y="270" width="780" height="250" rx="6" fill="none" stroke="#c8c8c8" stroke-width="1"/><rect x="142" y="258" width="356" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="150" y="276" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#333" font-weight="400" text-anchor="start">Ubicación de la carpeta de destino</text><rect x="154" y="298" width="732" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="155" y="330" width="730" height="2" rx="0" fill="#6f6f6f" stroke="none" stroke-width="1"/><text x="164" y="321" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">Crear una carpeta para cada usuario en la ruta de acceso raíz</text><text x="864" y="321" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#444" font-weight="400" text-anchor="start">⌄</text><rect x="150" y="294" width="740" height="42" rx="6" fill="none" stroke="#d9692b" stroke-width="4"/><circle cx="894" cy="286" r="19" fill="#d9692b" stroke="#fff" stroke-width="3"/><text x="894" y="293" font-family="Segoe UI, Inter, sans-serif" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="154" y="372" font-family="Segoe UI, Inter, sans-serif" font-size="19" fill="#1b1b1b" font-weight="400" text-anchor="start">Ruta de acceso raíz:</text><rect x="154" y="384" width="732" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="155" y="416" width="730" height="2" rx="0" fill="#6f6f6f" stroke="none" stroke-width="1"/><text x="164" y="407" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="start">\\SRV19\Redir$</text><rect x="150" y="380" width="740" height="42" rx="6" fill="none" stroke="#d9692b" stroke-width="4"/><circle cx="894" cy="372" r="19" fill="#d9692b" stroke="#fff" stroke-width="3"/><text x="894" y="379" font-family="Segoe UI, Inter, sans-serif" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="154" y="456" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#555" font-weight="400" text-anchor="start">Por ejemplo, la carpeta de Pepito se redirigirá a:</text><text x="154" y="486" font-family="Segoe UI, Inter, sans-serif" font-size="17" fill="#555" font-weight="400" text-anchor="start">\\SRV19\Redir$\pepito\Documents</text><rect x="556" y="560" width="110" height="34" rx="4" fill="#0067c0" stroke="#0067c0" stroke-width="1"/><text x="611.0" y="583" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#fff" font-weight="400" text-anchor="middle">Aceptar</text><rect x="678" y="560" width="110" height="34" rx="4" fill="#fbfbfb" stroke="#9a9a9a" stroke-width="1"/><text x="733.0" y="583" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="middle">Cancelar</text><rect x="800" y="560" width="110" height="34" rx="4" fill="#fbfbfb" stroke="#9a9a9a" stroke-width="1"/><text x="855.0" y="583" font-family="Segoe UI, Inter, sans-serif" font-size="18" fill="#1b1b1b" font-weight="400" text-anchor="middle">Aplicar</text></svg>